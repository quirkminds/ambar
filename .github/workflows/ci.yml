name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails when anything that looks like a secret is in the history: every commit reachable from what is
  # checked out (on a pull request, its merge with the base), not just the latest files. A known false
  # positive goes in .gitleaksignore by fingerprint; a real secret is rotated first, never only ignored.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release's checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary, not gitleaks-action: the action needs a paid license on organization repositories.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # --redact: the logs of a public repository are public; a finding shows where, never the value.
      - name: Scan for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ambar
          POSTGRES_PASSWORD: ambar
          POSTGRES_DB: ambar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambar -d ambar"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://ambar:ambar@localhost:5432/ambar?sslmode=disable
      # Required by the landing build (astro.config env schema); any valid URL works in CI.
      PUBLIC_APP_URL: http://localhost:5173
      # Required by the app build (src/env.ts).
      VITE_SITE_URL: http://localhost:4321

    steps:
      - uses: actions/checkout@v7

      # Astro 7 requires Node >= 22.12; its CLI runs on Node even when started through Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:openapi
      - run: bun run build
      - run: bun run --filter @ambar/core test
      - run: bun run test:api
